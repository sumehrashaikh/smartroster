<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart Roster | Sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><main class="login-card"><div class="brand"><span class="brand-mark">SR</span> Smart Roster</div><p class="eyebrow">Operations workspace</p><h1>Welcome back</h1><p class="hero-copy">Sign in to manage rosters, tasks and employee updates.</p>{% if error %}<div class="error-banner">{{ error }}</div>{% endif %}<form method="post" class="login-form"><input type="hidden" name="next" value="{{ next or '' }}"><label>Username<input name="username" required autofocus placeholder="manager"></label><label>Password<input type="password" name="password" required placeholder="••••••••"></label><button class="button primary" type="submit">Sign in</button></form><p class="login-hint">Demo users: manager / manager123 · employee / employee123</p></main></body></html>
